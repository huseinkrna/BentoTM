<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TimeMark • Presensi Bento Coffee</title>

    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #14141c;
            --bg-card: #1a1a26;
            --bg-glass: rgba(18, 18, 30, 0.7);
            --text-primary: #f0f0f5;
            --text-secondary: #c5c5d2;
            --text-muted: #8b8b9e;
            --accent: #4da3ff;
            --accent-hover: #6bb5ff;
            --accent-glow: rgba(77, 163, 255, 0.35);
            --success: #34c759;
            --success-hover: #48d66c;
            --danger: #ff453a;
            --danger-hover: #ff5f55;
            --warning: #ffd60a;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.2);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --radius-xl: 20px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --font-display: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
            --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 320ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
            --focus-ring: 0 0 0 3px rgba(77, 163, 255, 0.55);
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.78);
            --text-primary: #111118;
            --text-secondary: #3a3a4a;
            --text-muted: #6e6e80;
            --border-subtle: rgba(0, 0, 0, 0.07);
            --border-active: rgba(0, 0, 0, 0.18);
            --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.07);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --accent: #0066d6;
            --accent-hover: #0077f0;
            --accent-glow: rgba(0, 102, 214, 0.25);
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --transition-fast: 0ms;
                --transition-smooth: 0ms;
                --transition-bounce: 0ms;
            }
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-contrast: high) {
            :root {
                --bg-primary: #000;
                --bg-secondary: #000;
                --bg-card: #000;
                --text-primary: #fff;
                --text-secondary: #fff;
                --border-subtle: rgba(255, 255, 255, 0.4);
                --border-active: rgba(255, 255, 255, 0.7);
                --accent: #5db8ff;
                --success: #3ceb6a;
                --danger: #ff5e52;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            padding: clamp(12px, 3vw, 24px);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color var(--transition-smooth), color var(--transition-smooth);
        }

        .skip-link {
            position: absolute;
            top: -100px;
            left: 16px;
            background: var(--accent);
            color: #000;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            z-index: 1000;
            font-weight: 700;
            text-decoration: none;
            transition: top var(--transition-fast);
            font-family: var(--font-body);
        }
        .skip-link:focus {
            top: 16px;
            outline: none;
            box-shadow: var(--focus-ring);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .app-title {
            font-family: var(--font-display);
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-title .icon {
            font-size: 1.5em;
            line-height: 1;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 2px solid var(--border-subtle);
            color: var(--text-primary);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            position: relative;
        }
        .theme-toggle:hover {
            border-color: var(--border-active);
            background: var(--bg-glass);
            box-shadow: var(--shadow-sm);
        }
        .theme-toggle:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-color: var(--accent);
        }
        .theme-toggle:active {
            transform: scale(0.94);
        }

        .camera-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition-smooth);
            position: relative;
        }

        .viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            overflow: hidden;
        }
        .viewport video,
        .viewport canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .viewport video {
            z-index: 1;
        }
        .viewport canvas {
            z-index: 2;
        }

        .flash-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 60ms ease-out;
            border-radius: inherit;
        }
        .flash-overlay.active {
            opacity: 0.9;
            transition: opacity 40ms ease-in;
        }

        .countdown-overlay {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .countdown-number {
            font-family: var(--font-display);
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 60px rgba(0, 0, 0, 0.7), 0 0 120px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.04em;
            animation: countPulse 0.9s ease-out;
            opacity: 0;
        }
        .countdown-number.visible {
            opacity: 1;
            animation: countPulse 0.9s ease-out;
        }
        @keyframes countPulse {
            0% {
                transform: scale(1.6);
                opacity: 0;
            }
            30% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0.85);
                opacity: 0.6;
            }
        }

        .status-bar {
            padding: 10px 16px;
            text-align: center;
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            transition: color var(--transition-fast);
        }
        .status-bar.warning {
            color: var(--warning);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: dotPulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 6px var(--success);
            }
            50% {
                opacity: 0.4;
                box-shadow: 0 0 2px var(--success);
            }
        }
        .status-dot.warning-dot {
            background: var(--warning);
            box-shadow: 0 0 6px var(--warning);
        }
        .status-dot.offline-dot {
            background: var(--danger);
            box-shadow: 0 0 6px var(--danger);
        }

        .controls-area {
            padding: 16px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .controls-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .select-wrapper {
            position: relative;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
        }
        .select-wrapper select {
            width: 100%;
            padding: 13px 40px 13px 16px;
            font-size: 0.95rem;
            font-family: var(--font-body);
            font-weight: 500;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all var(--transition-fast);
            letter-spacing: 0.01em;
        }
        .select-wrapper select:hover {
            border-color: var(--border-active);
        }
        .select-wrapper select:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-color: var(--accent);
        }
        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: color var(--transition-fast);
        }

        .btn {
            padding: 13px 22px;
            font-size: 0.95rem;
            font-family: var(--font-body);
            font-weight: 700;
            letter-spacing: 0.01em;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 80ms ease-out;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 16px var(--accent-glow);
            flex: 1;
            min-width: 140px;
            max-width: 220px;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 24px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-success {
            background: var(--success);
            color: #000;
            box-shadow: 0 4px 16px rgba(52, 199, 89, 0.3);
            flex: 1;
            min-width: 140px;
            max-width: 220px;
        }
        .btn-success:hover {
            background: var(--success-hover);
            box-shadow: 0 6px 24px rgba(52, 199, 89, 0.4);
            transform: translateY(-1px);
        }
        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            flex: 1;
            min-width: 120px;
            max-width: 180px;
        }
        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 69, 58, 0.3);
            transform: translateY(-1px);
        }
        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .watermark-info {
            text-align: center;
            padding: 6px 16px 8px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .watermark-info .code-badge {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
        }

        .screen-hidden {
            display: none !important;
        }

        .geo-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.73rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
        .geo-indicator.active {
            color: var(--success);
        }
        .geo-indicator.fetching {
            color: var(--warning);
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-family: var(--font-body);
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-subtle);
            z-index: 100;
            transition: transform var(--transition-bounce);
            pointer-events: none;
            text-align: center;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loading spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid var(--warning);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 380px) {
            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }
            .select-wrapper,
            .btn {
                max-width: 100%;
                flex: auto;
            }
            .btn {
                width: 100%;
            }
        }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <a href="#mainContent" class="skip-link" aria-label="Lewati ke konten utama">Lewati ke konten utama</a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <main class="app-container" id="mainContent" aria-label="Aplikasi TimeMark Presensi">

        <header class="app-header">
            <h1 class="app-title">
                <span class="icon" aria-hidden="true">📸</span>
                TimeMark
            </h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Ganti tema tampilan" title="Ganti tema gelap/terang" type="button">
                🌙
            </button>
        </header>

        <!-- Camera Screen -->
        <section id="cameraScreen" class="camera-card" aria-label="Layar kamera">
            <div class="viewport" id="viewport">
                <video id="video" autoplay playsinline muted aria-label="Pratinjau kamera langsung"></video>
                <div class="flash-overlay" id="flashOverlay"></div>
                <div class="countdown-overlay" id="countdownOverlay">
                    <span class="countdown-number" id="countdownNumber"></span>
                </div>
            </div>
            <div class="status-bar" id="statusBar">
                <span class="status-dot" id="statusDot" aria-hidden="true"></span>
                <span id="statusText">Kamera siap</span>
                <span class="geo-indicator" id="geoIndicator" aria-label="Status lokasi">📍 mencari lokasi...</span>
            </div>
            <div class="controls-area">
                <div class="controls-row">
                    <div class="select-wrapper">
                        <select id="timerMode" aria-label="Pilih mode timer foto">
                            <option value="0">⚡ Tanpa Timer</option>
                            <option value="3">⏱ Timer 3 detik</option>
                            <option value="5">⏱ Timer 5 detik</option>
                            <option value="10">⏱ Timer 10 detik</option>
                        </select>
                    </div>
                    <button id="captureBtn" class="btn btn-primary" aria-label="Ambil foto sekarang" type="button">
                        📷 Jepret Foto
                    </button>
                </div>
            </div>
        </section>

        <!-- Preview Screen -->
        <section id="previewScreen" class="camera-card screen-hidden" aria-label="Layar pratinjau hasil foto">
            <div class="viewport" id="previewViewport">
                <canvas id="canvas" aria-label="Hasil foto dengan watermark"></canvas>
            </div>
            <div class="watermark-info" id="watermarkInfo">
                <span>📍</span>
                <span id="watermarkLabel">Watermark: Waktu • Tanggal • Lokasi • Kode Unik</span>
            </div>
            <div class="controls-area">
                <div class="controls-row">
                    <button id="retakeBtn" class="btn btn-danger" aria-label="Ulangi pengambilan foto" type="button">
                        🔄 Ulangi
                    </button>
                    <button id="shareBtn" class="btn btn-success" aria-label="Bagikan foto ke WhatsApp" type="button">
                        💬 Teruskan ke WA
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        (function() {
            // ────────────────────────────
            // DOM Elements
            // ────────────────────────────
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const cameraScreen = document.getElementById('cameraScreen');
            const previewScreen = document.getElementById('previewScreen');
            const captureBtn = document.getElementById('captureBtn');
            const retakeBtn = document.getElementById('retakeBtn');
            const shareBtn = document.getElementById('shareBtn');
            const timerMode = document.getElementById('timerMode');
            const statusText = document.getElementById('statusText');
            const statusBar = document.getElementById('statusBar');
            const statusDot = document.getElementById('statusDot');
            const flashOverlay = document.getElementById('flashOverlay');
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumber = document.getElementById('countdownNumber');
            const themeToggle = document.getElementById('themeToggle');
            const toast = document.getElementById('toast');
            const geoIndicator = document.getElementById('geoIndicator');
            const watermarkLabel = document.getElementById('watermarkLabel');
            const watermarkInfo = document.getElementById('watermarkInfo');

            let currentImageFile = null;
            let stream = null;
            let isCapturing = false;
            let geolocationData = null; // { lat, lng, accuracy }
            let addressData = null; // { display_name, road, city, country ... }
            let currentUniqueCode = null; // generated unique validation code
            let countdownInterval = null;
            let geoWatchId = null;

            // ────────────────────────────
            // Toast
            // ────────────────────────────
            let toastTimeout;

            function showToast(message, duration = 2800) {
                clearTimeout(toastTimeout);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            // ────────────────────────────
            // Theme
            // ────────────────────────────
            function initTheme() {
                const saved = localStorage.getItem('timemark-theme') || 'dark';
                document.documentElement.setAttribute('data-theme', saved);
                updateThemeIcon(saved);
            }

            function updateThemeIcon(theme) {
                themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
                themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Ganti ke tema terang' : 'Ganti ke tema gelap');
            }
            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('timemark-theme', next);
                updateThemeIcon(next);
                showToast(next === 'dark' ? '🌙 Mode gelap aktif' : '☀️ Mode terang aktif');
            });

            // ────────────────────────────
            // Ripple
            // ────────────────────────────
            document.querySelectorAll('.btn').forEach(btn => {
                btn.addEventListener('pointerdown', function(e) {
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    ripple.style.width = size + 'px';
                    ripple.style.height = size + 'px';
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    this.appendChild(ripple);
                    ripple.addEventListener('animationend', () => ripple.remove());
                });
            });

            // ────────────────────────────
            // Unique Code Generator
            // ────────────────────────────
            function generateUniqueCode() {
                const now = new Date();
                const ts = now.getTime().toString(36).toUpperCase(); // timestamp base36
                const rand = crypto.getRandomValues(new Uint8Array(6));
                const randHex = Array.from(rand)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('')
                    .toUpperCase();
                const datePart = now.toISOString().slice(0, 10).replace(/-/g, ''); // YYYYMMDD
                const timePart = now.toISOString().slice(11, 19).replace(/:/g, ''); // HHMMSS
                // Format: TM-YYYYMMDD-HHMMSS-RANDHEX
                const code = `TM-${datePart}-${timePart}-${randHex.slice(0, 8)}`;
                return code;
            }

            function verifyCodeFormat(code) {
                // Check if code matches pattern TM-YYYYMMDD-HHMMSS-XXXXXXXX
                const pattern = /^TM-\d{8}-\d{6}-[A-F0-9]{8}$/;
                return pattern.test(code);
            }

            // ────────────────────────────
            // Camera
            // ────────────────────────────
            async function startCamera() {
                try {
                    statusText.textContent = 'Meminta akses kamera...';
                    statusBar.classList.remove('warning');
                    statusDot.className = 'status-dot';

                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1440 }
                        },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    statusText.textContent = 'Kamera siap • menghadap belakang';
                    captureBtn.disabled = false;
                    statusDot.className = 'status-dot';
                } catch (err) {
                    console.error('Camera error:', err);
                    statusText.textContent = '⚠️ Gagal mengakses kamera. Periksa izin.';
                    statusBar.classList.add('warning');
                    statusDot.className = 'status-dot warning-dot';
                    captureBtn.disabled = true;
                    if (err.name === 'NotAllowedError') showToast('🚫 Izin kamera ditolak. Buka pengaturan.');
                    else if (err.name === 'NotFoundError') showToast('📷 Tidak ada kamera terdeteksi.');
                    else showToast('❌ Gagal mengakses kamera.');
                }
            }

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    stream = null;
                    video.srcObject = null;
                }
            }

            // ────────────────────────────
            // Geolocation + Reverse Geocoding (Nominatim - FREE, no API key)
            // ────────────────────────────
            function updateGeoUI(status, text) {
                geoIndicator.textContent = text;
                geoIndicator.classList.remove('active', 'fetching');
                if (status === 'active') geoIndicator.classList.add('active');
                if (status === 'fetching') geoIndicator.classList.add('fetching');
            }

            function fetchGeolocation() {
                if (!navigator.geolocation) {
                    updateGeoUI('', '📍 tidak tersedia');
                    geolocationData = null;
                    addressData = null;
                    return;
                }

                updateGeoUI('fetching', '📍 mencari GPS...');

                // Clear previous watch
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);

                // Use getCurrentPosition first for speed
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        geolocationData = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        updateGeoUI('fetching', '📍 GPS OK, ambil alamat...');
                        // Reverse geocode
                        await reverseGeocode(geolocationData.lat, geolocationData.lng);
                    },
                    (err) => {
                        console.warn('Geolocation error:', err);
                        geolocationData = null;
                        addressData = null;
                        updateGeoUI('', '📍 tidak diizinkan / timeout');
                        showToast('⚠️ Lokasi tidak tersedia. Watermark akan menampilkan "Bento Coffee".');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    }
                );

                // Also set a watch for continuous updates
                geoWatchId = navigator.geolocation.watchPosition(
                    async (position) => {
                        const newLat = position.coords.latitude;
                        const newLng = position.coords.longitude;
                        // Only update if moved significantly (>50m)
                        if (geolocationData) {
                            const dist = haversineDistance(
                                geolocationData.lat,
                                geolocationData.lng,
                                newLat,
                                newLng
                            );
                            if (dist < 50) return; // no significant movement
                        }
                        geolocationData = {
                            lat: newLat,
                            lng: newLng,
                            accuracy: position.coords.accuracy
                        };
                        updateGeoUI('fetching', '📍 GPS update, ambil alamat...');
                        await reverseGeocode(newLat, newLng);
                    },
                    (err) => {
                        console.warn('Watch error:', err);
                    }, {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 30000
                    }
                );
            }

            // Haversine distance in meters
            function haversineDistance(lat1, lng1, lat2, lng2) {
                const R = 6371000;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLng = (lng2 - lng1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // Reverse geocoding using OpenStreetMap Nominatim (FREE, no API key)
            async function reverseGeocode(lat, lng) {
                try {
                    const url =
                        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=id&zoom=18&addressdetails=1`;
                    const response = await fetch(url, {
                        headers: { 'User-Agent': 'TimeMark-PWA-BentoCoffee/2.0' }
                    });
                    if (!response.ok) throw new Error('Nominatim fetch failed');
                    const data = await response.json();
                    if (data && data.display_name) {
                        addressData = {
                            display_name: data.display_name,
                            road: data.address?.road || data.address?.pedestrian || '',
                            suburb: data.address?.suburb || data.address?.village || data.address
                                ?.neighbourhood || '',
                            city: data.address?.city || data.address?.town || data.address?.county || '',
                            state: data.address?.state || data.address?.province || '',
                            country: data.address?.country || '',
                            postcode: data.address?.postcode || ''
                        };
                        // Build short address
                        const parts = [];
                        if (addressData.road) parts.push(addressData.road);
                        if (addressData.suburb) parts.push(addressData.suburb);
                        if (addressData.city) parts.push(addressData.city);
                        if (parts.length === 0 && addressData.display_name) {
                            parts.push(addressData.display_name.split(',')[0]);
                        }
                        addressData.short_address = parts.join(', ') || addressData.display_name ||
                            'Lokasi terdeteksi';
                        updateGeoUI('active', '📍 ' + addressData.short_address.substring(0, 35) + (
                            addressData.short_address.length > 35 ? '…' : ''));
                    } else {
                        addressData = null;
                        updateGeoUI('active', '📍 lokasi didapat (tanpa alamat)');
                    }
                } catch (err) {
                    console.warn('Reverse geocoding error:', err);
                    addressData = null;
                    updateGeoUI('active', '📍 lokasi didapat (offline)');
                }
            }

            // ────────────────────────────
            // Countdown & Capture
            // ────────────────────────────
            captureBtn.addEventListener('click', () => {
                if (isCapturing) return;
                const timer = parseInt(timerMode.value);
                if (timer > 0) {
                    startCountdown(timer);
                } else {
                    triggerCapture();
                }
            });

            function startCountdown(seconds) {
                if (isCapturing) return;
                isCapturing = true;
                captureBtn.disabled = true;
                let timeLeft = seconds;
                statusText.textContent = `⏳ Bersiap... ${timeLeft} detik`;
                countdownNumber.textContent = timeLeft;
                countdownNumber.classList.add('visible');
                countdownOverlay.style.display = 'flex';
                countdownNumber.style.animation = 'none';
                void countdownNumber.offsetWidth;
                countdownNumber.style.animation = 'countPulse 0.9s ease-out';

                countdownInterval = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        countdownNumber.textContent = timeLeft;
                        countdownNumber.style.animation = 'none';
                        void countdownNumber.offsetWidth;
                        countdownNumber.style.animation = 'countPulse 0.9s ease-out';
                        statusText.textContent = `⏳ Bersiap... ${timeLeft} detik`;
                    } else {
                        clearInterval(countdownInterval);
                        countdownInterval = null;
                        countdownNumber.textContent = '';
                        countdownNumber.classList.remove('visible');
                        countdownOverlay.style.display = 'none';
                        statusText.textContent = '📸 Memotret!';
                        triggerCapture();
                    }
                }, 1000);
            }

            function triggerCapture() {
                if (!stream || !video.videoWidth) {
                    showToast('⚠️ Kamera belum siap');
                    isCapturing = false;
                    captureBtn.disabled = false;
                    return;
                }
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 120);
                setTimeout(() => processPicture(), 60);
            }

            // ────────────────────────────
            // Process Picture with Watermark
            // ────────────────────────────
            function processPicture() {
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                canvas.width = vw;
                canvas.height = vh;

                // Draw video frame
                ctx.drawImage(video, 0, 0, vw, vh);

                // Generate unique code
                currentUniqueCode = generateUniqueCode();

                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                const dateString = now.toLocaleDateString('id-ID', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Location text
                let locationText = 'Bento Coffee';
                if (addressData && addressData.short_address) {
                    locationText = addressData.short_address;
                } else if (geolocationData) {
                    locationText =
                        `${geolocationData.lat.toFixed(5)}, ${geolocationData.lng.toFixed(5)}`;
                }

                // Scale
                const scaleFactor = Math.max(vw / 1920, 0.55);
                const cardW = Math.round(620 * scaleFactor);
                const cardH = Math.round(135 * scaleFactor);
                const cardX = Math.round(20 * scaleFactor);
                const cardY = Math.round(vh - cardH - 20 * scaleFactor);
                const cardRadius = Math.round(16 * scaleFactor);

                ctx.save();

                // Glass card background
                ctx.fillStyle = 'rgba(14, 14, 24, 0.62)';
                ctx.beginPath();
                roundedRect(ctx, cardX, cardY, cardW, cardH, cardRadius);
                ctx.fill();

                // Border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = Math.round(2 * scaleFactor);
                ctx.beginPath();
                roundedRect(ctx, cardX, cardY, cardW, cardH, cardRadius);
                ctx.stroke();

                // Inner gradient highlight
                const innerGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH * 0.4);
                innerGrad.addColorStop(0, 'rgba(255,255,255,0.07)');
                innerGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = innerGrad;
                ctx.beginPath();
                roundedRect(ctx, cardX + 3, cardY + 3, cardW - 6, cardH * 0.4, cardRadius - 3);
                ctx.fill();

                const paddingX = Math.round(18 * scaleFactor);
                const timeFontSize = Math.round(38 * scaleFactor);
                const dateFontSize = Math.round(18 * scaleFactor);
                const locFontSize = Math.round(15 * scaleFactor);
                const codeFontSize = Math.round(13 * scaleFactor);

                // Row 1: Time (left) + Location (right)
                const row1Y = cardY + Math.round(cardH * 0.30);
                ctx.fillStyle = '#ffffff';
                ctx.font = `700 ${timeFontSize}px "Plus Jakarta Sans", "Inter", sans-serif`;
                ctx.textBaseline = 'middle';
                ctx.fillText(timeString, cardX + paddingX, row1Y);

                // Location right-aligned
                ctx.fillStyle = '#ffd60a';
                ctx.font = `600 ${locFontSize}px "JetBrains Mono", monospace`;
                ctx.textAlign = 'right';
                const maxLocWidth = cardW - paddingX * 2 - 180 * scaleFactor;
                const locDisplay = truncateText(ctx, locationText, maxLocWidth);
                ctx.fillText('📍 ' + locDisplay, cardX + cardW - paddingX, row1Y);
                ctx.textAlign = 'start';

                // Row 2: Date
                const row2Y = cardY + Math.round(cardH * 0.58);
                ctx.fillStyle = '#d5d5e0';
                ctx.font = `500 ${dateFontSize}px "Inter", sans-serif`;
                ctx.fillText(dateString, cardX + paddingX, row2Y);

                // Row 3: Unique Code (validation badge)
                const row3Y = cardY + Math.round(cardH * 0.82);
                // Code background pill
                const codeText = currentUniqueCode;
                ctx.font = `700 ${codeFontSize}px "JetBrains Mono", monospace`;
                const codeWidth = ctx.measureText(codeText).width + Math.round(24 * scaleFactor);
                const codePillH = Math.round(24 * scaleFactor);
                const codePillX = cardX + paddingX;
                const codePillY = row3Y - codePillH / 2;

                ctx.fillStyle = 'rgba(77, 163, 255, 0.25)';
                ctx.beginPath();
                roundedRect(ctx, codePillX, codePillY, codeWidth, codePillH, Math.round(12 * scaleFactor));
                ctx.fill();
                ctx.strokeStyle = 'rgba(77, 163, 255, 0.5)';
                ctx.lineWidth = Math.round(1.2 * scaleFactor);
                ctx.beginPath();
                roundedRect(ctx, codePillX, codePillY, codeWidth, codePillH, Math.round(12 * scaleFactor));
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.fillText(codeText, codePillX + Math.round(12 * scaleFactor), row3Y);

                // Small lock icon
                ctx.fillStyle = '#34c759';
                ctx.font = `${Math.round(14*scaleFactor)}px sans-serif`;
                ctx.textAlign = 'right';
                ctx.fillText('🔒', cardX + cardW - paddingX, row3Y);
                ctx.textAlign = 'start';

                ctx.textBaseline = 'alphabetic';
                ctx.restore();

                // Convert to blob
                canvas.toBlob((blob) => {
                    const fileName = `TimeMark_${currentUniqueCode}.jpg`;
                    currentImageFile = new File([blob], fileName, { type: 'image/jpeg' });

                    // Update watermark info
                    watermarkLabel.innerHTML =
                        `📍 ${truncateTextForDisplay(locationText, 25)} &nbsp;|&nbsp; 🕐 ${timeString} &nbsp;|&nbsp; 📅 ${dateString}`;
                    // Show unique code badge
                    const existingBadge = watermarkInfo.querySelector('.code-badge');
                    if (existingBadge) existingBadge.remove();
                    const badge = document.createElement('span');
                    badge.className = 'code-badge';
                    badge.textContent = '🔒 ' + currentUniqueCode;
                    badge.title = 'Kode validasi unik - verifikasi keaslian foto';
                    badge.setAttribute('aria-label', 'Kode validasi: ' + currentUniqueCode);
                    watermarkInfo.appendChild(badge);

                    switchToPreview();
                    isCapturing = false;
                    captureBtn.disabled = false;
                    statusText.textContent = '✅ Foto berhasil diproses';
                }, 'image/jpeg', 0.88);
            }

            function truncateText(ctx, text, maxWidth) {
                if (ctx.measureText(text).width <= maxWidth) return text;
                let truncated = text;
                while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 1) {
                    truncated = truncated.slice(0, -1);
                }
                return truncated + '…';
            }

            function truncateTextForDisplay(text, maxLen) {
                if (text.length <= maxLen) return text;
                return text.substring(0, maxLen) + '…';
            }

            function roundedRect(ctx, x, y, w, h, r) {
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
            }

            function switchToPreview() {
                cameraScreen.classList.add('screen-hidden');
                previewScreen.classList.remove('screen-hidden');
                shareBtn.focus({ preventScroll: true });
                previewScreen.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function switchToCamera() {
                previewScreen.classList.add('screen-hidden');
                cameraScreen.classList.remove('screen-hidden');
                currentImageFile = null;
                currentUniqueCode = null;
                // Remove badge
                const badge = watermarkInfo.querySelector('.code-badge');
                if (badge) badge.remove();
                watermarkLabel.textContent = 'Watermark: Waktu • Tanggal • Lokasi • Kode Unik';
                statusText.textContent = 'Kamera siap';
                captureBtn.focus({ preventScroll: true });
                cameraScreen.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ────────────────────────────
            // Retake
            // ────────────────────────────
            retakeBtn.addEventListener('click', () => {
                currentImageFile = null;
                currentUniqueCode = null;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                switchToCamera();
            });

            // ────────────────────────────
            // Share (Web Share API)
            // ────────────────────────────
            shareBtn.addEventListener('click', async () => {
                if (!currentImageFile) {
                    showToast('⚠️ Tidak ada foto untuk dibagikan');
                    return;
                }

                const shareData = {
                    files: [currentImageFile],
                    title: 'Presensi Bento Coffee',
                    text: `📸 Presensi TimeMark\n🕐 ${new Date().toLocaleTimeString('id-ID')}\n🔒 Kode: ${currentUniqueCode}\n📍 ${addressData?.short_address || geolocationData ? `${geolocationData.lat.toFixed(5)},${geolocationData.lng.toFixed(5)}` : 'Bento Coffee'}`,
                };

                if (navigator.canShare && navigator.canShare(shareData)) {
                    try {
                        shareBtn.disabled = true;
                        shareBtn.textContent = '⏳ Membuka...';
                        await navigator.share(shareData);
                        showToast('✅ Foto siap diteruskan ke WhatsApp');
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.error('Share error:', err);
                            showToast('⚠️ Gagal membagikan foto');
                        }
                    } finally {
                        shareBtn.disabled = false;
                        shareBtn.textContent = '💬 Teruskan ke WA';
                    }
                } else {
                    // Fallback download
                    showToast('📥 Browser tidak mendukung share, mengunduh...');
                    const url = URL.createObjectURL(currentImageFile);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = currentImageFile.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showToast('✅ Foto diunduh. Kirim manual ke WhatsApp.');
                }
            });

            // ────────────────────────────
            // Keyboard shortcuts
            // ────────────────────────────
            document.addEventListener('keydown', (e) => {
                if ((e.key === ' ' || e.key === 'Enter') &&
                    !cameraScreen.classList.contains('screen-hidden') &&
                    !isCapturing &&
                    document.activeElement !== timerMode) {
                    e.preventDefault();
                    captureBtn.click();
                }
                if (e.key === 'Escape' && !previewScreen.classList.contains('screen-hidden')) {
                    e.preventDefault();
                    retakeBtn.click();
                }
            });

            // ────────────────────────────
            // Visibility
            // ────────────────────────────
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && stream && video.paused) {
                    video.play().catch(() => {});
                }
            });

            // ────────────────────────────
            // Init
            // ────────────────────────────
            function init() {
                initTheme();
                captureBtn.disabled = true;
                statusDot.className = 'status-dot';
                startCamera();
                fetchGeolocation();
                // Refresh geolocation every 2 minutes
                setInterval(fetchGeolocation, 120000);
            }

            window.addEventListener('beforeunload', () => {
                stopCamera();
                if (countdownInterval) clearInterval(countdownInterval);
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
            });

            init();

            console.log('%c📸 TimeMark PWA %c• v2.1 %c• Bento Coffee',
                'font-size:1.2em;font-weight:bold;',
                'color:#4da3ff;',
                'color:#ffd60a;');
            console.log('%c🔒 Unique Code • Nominatim Geocoding • WCAG AA/AAA',
                'color:#8b8b9e;font-style:italic;');
            console.log('%c💡 Kode unik digenerate tiap foto sebagai bukti validasi.',
                'color:#34c759;');
        })();
    </script>
</body>
